<meta name="color-scheme" content="dark">
<div id="box"></div>
<script>
  let l = ['LZPmiHq8AJE','J28oOfvNVD8','TPzyzi-Jydc','yRYKdwE2XT4'], i = 0, p;
  onYouTubeIframeAPIReady = () => p = new YT.Player('box', {
    videoId: l[i],
    host: 'https://www.youtube-nocookie.com',
    playerVars: { 'autoplay': 1 },
    events: {
      onStateChange: e => {
        if (e.data == -1) {
          document.body.insertAdjacentHTML('beforeend', `<br><a href="#" onclick="i=${i};p.loadVideoById(l[i]);">${p.getVideoData().title}</a>`);
        } else if (e.data == 0) p.loadVideoById(l[++i]);
      }
    }
  });
</script>
<script src="https://www.youtube.com/iframe_api"></script>
<br><a href="#" onclick="p.seekTo(p.getDuration())">next</a>
