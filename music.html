<meta name="color-scheme" content="dark">
<iframe id="f" type="text/html" frameborder="0" allow="playsinline; autoplay" allowfullscreen></iframe>>
<script>
    let l = ['LZPmiHq8AJE', 'J28oOfvNVD8', 'TPzyzi-Jydc', 'yRYKdwE2XT4'], i = 0, p, t;
    onYouTubeIframeAPIReady = () => p = new YT.Player('f', {
        videoId: l[i],
        host: 'https://www.youtube-nocookie.com',
        playerVars: { 'autoplay': 1, 'playsinline': 1 },
        events: {
            onStateChange: e => {
                if (e.data == -1) {
                    clearTimeout(t);
                    t = setTimeout(() => document.body.insertAdjacentHTML('beforeend', `<br><a href="#" onclick="p.loadVideoById(l[${i}])">${p.videoTitle}</a>`), 2000);
                } else if (e.data == 0) p.loadVideoById(l[++i]);
            }
        }
    });
</script>
<script src="https://www.youtube.com/iframe_api"></script>
<button style="font-size:36px" onclick="p.loadVideoById(l[--i])"><</button>
<button style="font-size:36px" onclick="p.loadVideoById(l[++i])">></button>
