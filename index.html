<meta name="color-scheme" content="dark">
<body>
<script>
    const v = new URLSearchParams(location.search).get("v");
    if (v) {
        document.body.innerHTML = `<iframe width="1120" height="630" src="https://www.youtube-nocookie.com/embed/${v}" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;
    }
</script>
</body>
