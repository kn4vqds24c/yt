<meta name="color-scheme" content="dark">
<body>
<script>
    const v = new URLSearchParams(location.search).get("v");
    if (v) {
        document.body.innerHTML = `<iframe width="1120" height="630" src="https://www.youtube-nocookie.com/embed/${v}?autoplay=1" frameborder="0" allow="autoplay" allowfullscreen></iframe>`;
    }
</script>
</body>
