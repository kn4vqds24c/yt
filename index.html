<meta name="color-scheme" content="dark">
<body>
<script>
    const v = new URLSearchParams(location.search).get("v");
    if (v) {
        document.body.innerHTML = `<iframe style="width: 100%; aspect-ratio: 16/9;" src="https://www.youtube-nocookie.com/embed/${v}?autoplay=1" frameborder="0" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;
    }
</script>
</body>
